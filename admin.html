<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الطلبات - مخزن القافلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Cairo',sans-serif;background:#0f172a;color:#f8fafc;padding:20px;max-width:1000px;margin:auto}
h1{color:#38bdf8;text-align:center}
.box{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;margin-bottom:20px}
input{width:100%;padding:12px;border:2px solid #334155;border-radius:12px;background:#0f172a;color:#f8fafc;font:inherit;box-sizing:border-box}
button{padding:10px 16px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;color:#fff}
.ok{background:#10b981}.pri{background:#2563eb}
.wrap{overflow-x:auto;border:1px solid #334155;border-radius:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;text-align:center;border-bottom:1px solid #334155;white-space:nowrap}
th{background:#0f172a;color:#38bdf8}
.done{color:#10b981;font-weight:700}.wait{color:#f59e0b;font-weight:700}
select{padding:10px 14px;border:2px solid #334155;border-radius:12px;background:#0f172a;color:#f8fafc;font:inherit;min-width:180px}
a{color:#38bdf8}
</style>
</head>
<body>
<h1>📋 إدارة الطلبات</h1>

<div class="box" id="login">
  <input type="password" id="pass" placeholder="كلمة المرور..." onkeypress="if(event.key==='Enter')login()">
  <button class="pri" style="margin-top:12px;width:100%" onclick="login()">تسجيل الدخول</button>
  <div id="err" style="color:#ef4444;margin-top:10px"></div>
</div>

<div id="app" style="display:none">
  <div class="box" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <label style="margin:0">القسم: <select id="catFilter" onchange="render()"><option value="الكل">كل الأقسام</option></select></label>
    <label><input type="checkbox" id="showAll" style="width:auto" onchange="render()"> عرض ما تم شراؤه</label>
    <button class="pri" onclick="load()" style="margin-right:auto">🔄 تحديث</button>
  </div>
  <div id="summary" style="margin:0 0 12px;color:#94a3b8;font-weight:600"></div>
  <div class="wrap"><table>
    <thead><tr><th>القسم</th><th>المنتج</th><th>الكمية المطلوب شراؤها</th><th>الطالب</th><th>رقم الطالب 📞</th><th>التاريخ</th><th>الصورة</th><th>الحالة</th><th>الإجراء</th></tr></thead>
    <tbody id="body"></tbody>
  </table></div>
</div>

<script>
// ضع هنا رابط نشر سكربت إدارة الطلبات (orders-script.gs)
const ordersURL = 'https://script.google.com/macros/s/AKfycbxHfp45pmgQpnjfZTgU2pRamDZ26UmqqSI9cShIgqLDyPaUG44SfkKK7NZdKxUPfbDk/exec';
let token = '', rows = [];
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const errMsg = r => r && (r.error || (r.status === 'error' ? (r.message || 'خطأ في السيرفر') : ''));

async function fetchRows(pass) { return (await fetch(ordersURL + '?pass=' + encodeURIComponent(pass))).json(); }

async function login() {
  const p = document.getElementById('pass').value, err = document.getElementById('err');
  err.innerText = '';
  if (!ordersURL.startsWith('http')) { err.innerText = '⚠️ لم يتم وضع رابط السكربت في الصفحة'; return; }
  try {
    const data = await fetchRows(p);
    if (errMsg(data)) { err.innerText = '❌ ' + errMsg(data); return; }
    token = p; rows = Array.isArray(data) ? data.reverse() : [];
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    render();
  } catch (e) { err.innerText = '⚠️ تعذر الاتصال بالسيرفر (' + e.message + ')'; }
}
async function load() {
  try { const d = await fetchRows(token); rows = Array.isArray(d) ? d.reverse() : []; render(); } catch (e) { alert('⚠️ تعذر التحديث'); }
}
function fillCategories() {
  const sel = document.getElementById('catFilter'), cur = sel.value;
  const pending = {};
  rows.forEach(r => { if (r.status === 'NEED_PURCHASE') pending[r.category] = (pending[r.category] || 0) + 1; });
  const cats = [...new Set(rows.map(r => r.category))];
  sel.innerHTML = '<option value="الكل">كل الأقسام</option>' +
    cats.map(c => `<option value="${esc(c)}">${esc(c)} (${pending[c] || 0})</option>`).join('');
  sel.value = cats.includes(cur) ? cur : 'الكل';
}
function render() {
  fillCategories();
  const all = document.getElementById('showAll').checked;
  const cat = document.getElementById('catFilter').value;
  const list = rows.filter(r => (all || r.status === 'NEED_PURCHASE') && (cat === 'الكل' || r.category === cat));
  const pendingCount = list.filter(r => r.status === 'NEED_PURCHASE').length;
  document.getElementById('summary').textContent = (cat === 'الكل' ? 'كل الأقسام' : 'قسم ' + cat) + ' — طلبات مطلوب شراؤها: ' + pendingCount;
  const body = document.getElementById('body');
  if (!list.length) { body.innerHTML = '<tr><td colspan="9">لا توجد طلبات شراء.</td></tr>'; return; }
  body.innerHTML = list.map(r => {
    const img = String(r.image).startsWith('http') ? `<a href="${esc(r.image)}" target="_blank">عرض</a>` : '-';
    const done = r.status === 'PO_CONFIRMED';
    return `<tr><td>${esc(r.category)}</td><td style="font-weight:700">${esc(r.item)}</td>
      <td>${esc(r.purchase_qty_needed)} ${esc(r.unit)}</td><td>${esc(r.requesterName)}</td><td>${r.contactNumber ? `<a href="tel:${esc(r.contactNumber)}" style="color:#f8fafc;text-decoration:none">${esc(r.contactNumber)}</a>` : '-'}</td><td>${esc(r.date)}</td><td>${img}</td>
      <td>${done ? '<span class="done">تم الشراء ✅</span>' : '<span class="wait">مطلوب شراؤه ⏳</span>'}</td>
      <td>${done ? '-' : `<button class="ok" onclick="bought(${r.row},this)">تم الشراء ✅</button>`}</td></tr>`;
  }).join('');
}
async function bought(row, btn) {
  if (!confirm('تأكيد: تم شراء هذه الكمية؟ (ستُورَّد للمخزن وتُصرف مباشرة للطلب)')) return;
  btn.disabled = true;
  try {
    const r = await (await fetch(ordersURL, { method: 'POST', body: JSON.stringify({ action: 'markPurchased', row, pass: token }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })).json();
    if (errMsg(r)) alert('⚠️ ' + errMsg(r));
    await load();
  } catch (e) { alert('⚠️ حدث خطأ'); btn.disabled = false; }
}
</script>
</body>
</html>
