<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن - مخزن القافلة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #10b981; padding: 20px; max-width: 1000px; margin: auto; }
        .header { text-align: center; padding: 20px; background: rgba(16, 185, 129, 0.1); border-radius: 15px; margin-bottom: 25px; border: 1px solid #10b981; }
        .header h1 { margin: 0; font-size: 2.2em; text-shadow: 0 0 10px #10b981; }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 50px; background: #1e293b; padding: 40px; border-radius: 15px; border: 1px solid #334155; max-width: 400px; margin-left: auto; margin-right: auto; }
        #login-screen input { width: 100%; padding: 12px; border: 2px solid #334155; border-radius: 10px; background-color: #0f172a; color: #34d399; font-family: 'Cairo', sans-serif; font-size: 16px; margin-bottom: 15px; text-align: center;}
        #login-screen button { width: 100%; padding: 15px; background: #10b981; color: #000; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        #login-screen button:hover { background: #34d399; }
        #login-error { color: #ef4444; display: none; margin-top: 10px; font-weight: bold;}

        #admin-content { display: none; }
        .form-container { background: #1e293b; padding: 25px; border-radius: 15px; border: 1px solid #334155; box-shadow: 0 0 15px rgba(0,0,0,0.5); margin-bottom:20px;}
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        label { font-weight: 600; color: #34d399; margin-bottom: 5px; display: block; }
        select, input { width: 100%; padding: 12px; border: 2px solid #334155; border-radius: 10px; background-color: #0f172a; color: #34d399; font-family: 'Cairo', sans-serif; font-size: 16px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 15px; background: #10b981; color: #000; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #34d399; }
        
        .filter-container { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; display: flex; align-items: center; gap: 15px; margin-bottom: 20px;}
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #10b981; }
        .img-preview { max-width: 60px; max-height: 60px; border-radius: 8px; border: 1px solid #10b981; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: 'Cairo'; font-weight: bold;}
        .btn-delete:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ لوحة تحكم الأدمن</h1>
        <p style="margin:0; color:#94a3b8;">إضافة ومسح وعرض كافة المشتريات</p>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen">
        <label style="color:#34d399; font-size:1.2em; margin-bottom:15px;">أدخل كلمة المرور:</label>
        <input type="password" id="adminPass" placeholder="كلمة المرور..." onkeypress="if(event.key === 'Enter') checkPassword()">
        <button onclick="checkPassword()">تسجيل الدخول</button>
        <div id="login-error">❌ كلمة المرور غير صحيحة</div>
    </div>

    <!-- محتوى الأدمن -->
    <div id="admin-content">
        <!-- فورم الإضافة للأدمن -->
        <div class="form-container">
            <h3 style="margin-top:0;">➕ إضافة مشتريات (كأدمن)</h3>
            <form id="purchaseForm" onsubmit="submitData(event)">
                <div class="grid">
                    <div>
                        <label>القسم:</label>
                        <select id="category" required>
                            <option value="" disabled selected>اختر القسم...</option>
                            <option value="العاب">العاب</option>
                            <option value="اكل خدام">اكل خدام</option>
                            <option value="شنطه الانبا ابرام">شنطه الانبا ابرام</option>
                            <option value="ديكور">ديكور</option>
                            <option value="عمل فني">عمل فني</option>
                            <option value="عمل خدمي">عمل خدمي</option>
                        </select>
                    </div>
                    <div>
                        <label>اسم الخادم:</label>
                        <input type="text" id="servantName" placeholder="اسم الخادم..." required>
                    </div>
                    <div>
                        <label>رقم التواصل:</label>
                        <input type="tel" id="contactNumber" placeholder="رقم الموبايل..." required>
                    </div>
                    <div>
                        <label>المشتريات:</label>
                        <input type="text" id="item" placeholder="اسم المنتج..." required>
                    </div>
                    <div>
                        <label>الكميه:</label>
                        <input type="number" id="qty" min="0.1" step="0.1" required>
                    </div>
                    <div>
                        <label>الوحده:</label>
                        <select id="unit" required>
                            <option value="" disabled selected>اختر الوحدة...</option>
                            <option value="قطعه">قطعه</option>
                            <option value="كيلو">كيلو</option>
                            <option value="لتر">لتر</option>
                        </select>
                    </div>
                    <div>
                        <label>تاريخ استلام المنتج:</label>
                        <input type="date" id="date" required>
                    </div>
                    <div>
                        <label>صوره المنتج:</label>
                        <input type="file" id="image" accept="image/*">
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">حفظ البيانات</button>
            </form>
        </div>

        <!-- الفلتر والجدول -->
        <div class="filter-container">
            <label>🔍 عرض المشتريات لقسم:</label>
            <select id="filterCategory" onchange="renderTable()">
                <option value="الكل">عرض كل الأقسام</option>
                <option value="العاب">العاب</option>
                <option value="اكل خدام">اكل خدام</option>
                <option value="شنطه الانبا ابرام">شنطه الانبا ابرام</option>
                <option value="ديكور">ديكور</option>
                <option value="عمل فني">عمل فني</option>
                <option value="عمل خدمي">عمل خدمي</option>
            </select>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>القسم</th>
                        <th>الخادم</th>
                        <th>الرقم</th>
                        <th>المنتج</th>
                        <th>الكميه</th>
                        <th>الوحده</th>
                        <th>التاريخ</th>
                        <th>الصورة</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="9">⏳ جاري تحميل البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwC3e24lAC-A6REE52WHVoIK5UH77F7S_lhxrE25YMuwb0OxGvm9tlSe-ZMBNPQ0nvTQw/exec';
        const PASSWORD = 'kafela20'; // 🔴 غير الباسوورد من هنا 🔴

        let globalData = []; 
        document.getElementById('date').valueAsDate = new Date();

        function checkPassword() {
            const passInput = document.getElementById('adminPass').value;
            if(passInput === PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadData(); 
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        async function loadData() {
            try {
                const res = await fetch(scriptURL);
                const data = await res.json();
                
                if (data.error || data.length === 0) {
                    document.getElementById('tableBody').innerHTML = '<tr><td colspan="9">لا توجد مشتريات مسجلة بعد.</td></tr>';
                    return;
                }

                globalData = data.reverse(); 
                renderTable(); 
                
            } catch (error) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="9" style="color:red;">⚠️ خطأ في تحميل البيانات.</td></tr>';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const filterValue = document.getElementById('filterCategory').value;
            tbody.innerHTML = '';

            let filteredData = globalData;
            if (filterValue !== 'الكل') {
                filteredData = globalData.filter(row => row.category === filterValue);
            }

            if (!filteredData || filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9">لا توجد مشتريات مسجلة في هذا القسم.</td></tr>';
                return;
            }

            filteredData.forEach(row => {
                let imgHtml = (row.image !== 'بدون صورة' && row.image !== '') ? `<a href="${row.image}" target="_blank"><img src="${row.image}" class="img-preview"></a>` : 'بدون صورة';
                tbody.innerHTML += `
                    <tr>
                        <td><span style="background:#0f172a; padding:4px 8px; border-radius:5px; border:1px solid #10b981;">${row.category}</span></td>
                        <td style="color:#34d399; font-weight:bold;">${row.servantName || '-'}</td>
                        <td>${row.contactNumber || '-'}</td>
                        <td style="font-weight:bold;">${row.item}</td>
                        <td>${row.qty}</td>
                        <td>${row.unit}</td>
                        <td>${row.date}</td>
                        <td>${imgHtml}</td>
                        <td>
                            <button class="btn-delete" onclick="deleteRecord(${row.row}, this)">مسح 🗑️</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function deleteRecord(rowNum, btn) {
            if(!confirm('⚠️ هل أنت متأكد أنك تريد مسح هذا المنتج نهائياً من الشيت؟')) return;
            
            let originalText = btn.innerText;
            btn.innerText = '⏳';
            btn.disabled = true;

            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', row: rowNum }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                alert('✅ تم المسح بنجاح');
                loadData(); 
            } catch (e) {
                alert('⚠️ حدث خطأ أثناء المسح');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function submitData(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "⏳ جاري الحفظ...";

            try {
                let file = document.getElementById('image').files[0];
                let payload = {
                    action: 'add',
                    category: document.getElementById('category').value,
                    servantName: document.getElementById('servantName').value,
                    contactNumber: document.getElementById('contactNumber').value,
                    item: document.getElementById('item').value,
                    qty: document.getElementById('qty').value,
                    unit: document.getElementById('unit').value,
                    date: document.getElementById('date').value,
                    imageBase64: null, mimeType: null, imageName: null
                };

                if (file) {
                    payload.imageBase64 = await getBase64(file);
                    payload.mimeType = file.type;
                    payload.imageName = file.name;
                }

                await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                alert("✅ تم إضافة المشتريات بنجاح!");
                document.getElementById('purchaseForm').reset();
                document.getElementById('date').valueAsDate = new Date(); 
                document.getElementById('filterCategory').value = "الكل";
                loadData(); 
                
            } catch (error) {
                alert("⚠️ حدث خطأ أثناء الحفظ!");
            } finally {
                btn.disabled = false;
                btn.innerText = "حفظ البيانات";
            }
        }
    </script>
</body>
</html>
