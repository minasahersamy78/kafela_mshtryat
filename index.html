<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل المشتريات - أسرة الأنبا ابرام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; max-width: 900px; margin: auto; box-sizing: border-box; }
        
        /* تصميم الهيدر مع اللوجو */
        .header { 
            text-align: center; 
            padding: 35px 20px; 
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.1) 0%, rgba(16, 185, 129, 0.1) 100%); 
            border-radius: 20px; 
            margin-bottom: 30px; 
            border: 2px solid #1e40af; 
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.15);
            position: relative;
        }
        
        /* إطار دائري متوهج ومكبر للوجو */
        .logo-container {
            width: 140px; 
            height: 140px; 
            background-color: #ffffff;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.5), 0 0 10px rgba(16, 185, 129, 0.4);
            border: 4px solid #3b82f6;
            overflow: hidden;
        }
        .logo-container img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }
        
        .header h1 { margin: 5px 0 0; font-size: 2.2em; color: #3b82f6; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .header p { margin: 8px 0 0; color: #94a3b8; font-size: 1.1em; font-weight: 600; }
        
        .form-container { 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 20px; 
            border: 1px solid #334155; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
            width: 100%; 
            box-sizing: border-box; 
        }
        
        .grid { display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; width: 100%; }
        .grid > div { width: 100%; box-sizing: border-box; }
        
        @media (min-width: 768px) {
            .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        }

        label { font-weight: 600; color: #38bdf8; margin-bottom: 8px; display: block; font-size: 1.05em; }
        
        select, input { 
            width: 100%; 
            display: block;
            padding: 14px 18px; 
            border: 2px solid #334155; 
            border-radius: 12px; 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: 'Cairo', sans-serif; 
            font-size: 16px; 
            box-sizing: border-box; 
            -webkit-appearance: none; 
            appearance: none;
            transition: all 0.3s ease;
        }
        select:focus, input:focus { 
            border-color: #3b82f6; 
            outline: none; 
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
        }
        
        .btn-submit { 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(135deg, #2563eb 0%, #10b981 100%); 
            color: #ffffff; 
            font-size: 20px; 
            font-weight: 700; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s; 
            margin-top: 15px; 
            display: block; 
            box-sizing: border-box; 
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:hover { 
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); 
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .table-container { margin-top: 35px; overflow-x: auto; width: 100%; border-radius: 15px; border: 1px solid #334155;}
        table { width: 100%; border-collapse: collapse; background: #1e293b; overflow: hidden; font-size: 1em; }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #334155; white-space: nowrap; }
        th { background: #0f172a; color: #38bdf8; font-weight: 700; font-size: 1.05em; }
        .img-preview { max-width: 60px; max-height: 60px; border-radius: 6px; border: 1px solid #3b82f6; }
        .section-title { color: #38bdf8; margin: 40px 0 15px; text-align: center; font-size: 1.5em; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px;}
    </style>
</head>
<body>

    <!-- الهيدر مع اللوجو -->
    <div class="header">
        <div class="logo-container">
            <img src="logo.jpg" alt="شعار القافلة" onerror="this.style.display='none';">
        </div>
        <h1>🛒 تسجيل المشتريات</h1>
        <p>أسرة الأنبا ابرام - القافلة</p>
    </div>

    <div class="form-container">
        <form id="purchaseForm" onsubmit="submitData(event)">
            <div class="grid">
                <div>
                    <label>القسم:</label>
                    <select id="category" required>
                        <option value="" disabled selected>اختر القسم...</option>
                        <option value="العاب">العاب</option>
                        <option value="اكل خدام">اكل خدام</option>
                        <option value="شنطه الانبا ابرام">شنطه الانبا ابرام</option>
                        <option value="ديكور">ديكور</option>
                        <option value="عمل فني">عمل فني</option>
                        <option value="عمل خدمي">عمل خدمي</option>
                    </select>
                </div>
                <div>
                    <label>اسم الخادم:</label>
                    <input type="text" id="servantName" placeholder="اسم الخادم..." required>
                </div>
                <div>
                    <label>رقم التواصل:</label>
                    <input type="tel" id="contactNumber" placeholder="رقم الموبايل..." required>
                </div>
                <div>
                    <label>المشتريات:</label>
                    <input type="text" id="item" placeholder="اسم المنتج..." required>
                </div>
                <div>
                    <label>الكميه:</label>
                    <input type="number" id="qty" min="0.1" step="0.1" placeholder="الكمية..." required>
                </div>
                <div>
                    <label>الوحده:</label>
                    <select id="unit" required>
                        <option value="" disabled selected>اختر الوحدة...</option>
                        <option value="قطعه">قطعه</option>
                        <option value="كيلو">كيلو</option>
                        <option value="لتر">لتر</option>
                    </select>
                </div>
                <div>
                    <label>تاريخ طلب المنتج:</label>
                    <!-- سيتم ضبط الحد الأدنى برمجياً أدناه لمنع التواريخ السابقة -->
                    <input type="date" id="date" required>
                </div>
                <div>
                    <label>صورة المنتج:</label>
                    <input type="file" id="image" accept="image/*" required>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">حفظ البيانات</button>
        </form>
    </div>

    <h3 class="section-title">📋 المشتريات التي قمت بإضافتها الآن</h3>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>القسم</th>
                    <th>الخادم</th>
                    <th>الرقم</th>
                    <th>المنتج</th>
                    <th>الكمية</th>
                    <th>الوحدة</th>
                    <th>التاريخ</th>
                    <th>الصورة</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="8">لم تقم بإضافة أي مشتريات حتى الآن.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxLGfhKBA_ePk3gv-WwbI3WGKpzk5OBJNiXJk-bT_5ktoHOKcRyZl-N8U89xNLZVoUrog/exec';
        let sessionData = []; 

        // ضبط تاريخ اليوم ومنع اختيار أي تاريخ سابق
        const dateInput = document.getElementById('date');
        const today = new Date();
        // تعديل التوقيت لضمان صحة التاريخ حسب المنطقة الزمنية
        const localDate = new Date(today.getTime() - (today.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
        
        dateInput.value = localDate; // تعيين تاريخ اليوم كقيمة افتراضية
        dateInput.min = localDate;   // تعيين تاريخ اليوم كحد أدنى لمنع التواريخ القديمة

        function renderSessionTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (sessionData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8">لم تقم بإضافة أي مشتريات حتى الآن.</td></tr>';
                return;
            }

            [...sessionData].reverse().forEach(row => {
                let imgHtml = (row.imageBase64) ? `<img src="data:${row.mimeType};base64,${row.imageBase64}" class="img-preview">` : 'بدون صورة';
                tbody.innerHTML += `
                    <tr>
                        <td><span style="background:#0f172a; padding:4px 8px; border-radius:6px; border:1px solid #10b981; font-size: 0.9em;">${row.category}</span></td>
                        <td style="color:#38bdf8; font-weight:bold;">${row.servantName}</td>
                        <td>${row.contactNumber}</td>
                        <td style="font-weight:bold;">${row.item}</td>
                        <td>${row.qty}</td>
                        <td>${row.unit}</td>
                        <td>${row.date}</td>
                        <td>${imgHtml}</td>
                    </tr>
                `;
            });
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function submitData(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "⏳ جاري الحفظ والتأمين...";

            try {
                let file = document.getElementById('image').files[0];
                let payload = {
                    action: 'add',
                    category: document.getElementById('category').value,
                    servantName: document.getElementById('servantName').value,
                    contactNumber: document.getElementById('contactNumber').value,
                    item: document.getElementById('item').value,
                    qty: document.getElementById('qty').value,
                    unit: document.getElementById('unit').value,
                    date: document.getElementById('date').value,
                    imageBase64: await getBase64(file),
                    mimeType: file.type,
                    imageName: file.name
                };

                await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                sessionData.push(payload);
                renderSessionTable();
                alert("✅ تم تسجيل طلب الشراء بنجاح! سينتظر تأكيد الأدمن ليتم إضافته للمخزن.");
                document.getElementById('purchaseForm').reset();
                
                // إعادة تعيين التاريخ لتاريخ اليوم مرة أخرى بعد المسح
                dateInput.value = localDate; 
                
            } catch (error) {
                alert("⚠️ حدث خطأ أثناء الحفظ!");
            } finally {
                btn.disabled = false;
                btn.innerText = "حفظ البيانات";
            }
        }
    </script>
</body>
</html>
