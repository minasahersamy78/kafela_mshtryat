<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل المشتريات - مخزن القافلة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #10b981; padding: 15px; max-width: 800px; margin: auto; box-sizing: border-box; }
        .header { text-align: center; padding: 20px; background: rgba(16, 185, 129, 0.1); border-radius: 15px; margin-bottom: 20px; border: 1px solid #10b981; }
        .header h1 { margin: 0; font-size: 1.8em; text-shadow: 0 0 10px #10b981; }
        .form-container { background: #1e293b; padding: 20px; border-radius: 15px; border: 1px solid #334155; box-shadow: 0 0 15px rgba(0,0,0,0.5); width: 100%; box-sizing: border-box; }
        
        .grid { display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px; width: 100%; }
        .grid > div { width: 100%; box-sizing: border-box; }
        
        @media (min-width: 768px) {
            .grid { display: grid; grid-template-columns: 1fr 1fr; }
        }

        label { font-weight: 600; color: #34d399; margin-bottom: 5px; display: block; font-size: 0.95em; }
        
        select, input { 
            width: 100%; 
            display: block;
            padding: 12px; 
            border: 2px solid #334155; 
            border-radius: 10px; 
            background-color: #0f172a; 
            color: #34d399; 
            font-family: 'Cairo', sans-serif; 
            font-size: 16px; 
            box-sizing: border-box; 
            -webkit-appearance: none; 
            appearance: none;
        }
        select:focus, input:focus { border-color: #10b981; outline: none; }
        
        .btn-submit { width: 100%; padding: 15px; background: #10b981; color: #000; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; margin-top: 10px; display: block; box-sizing: border-box; }
        .btn-submit:hover { background: #34d399; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .table-container { margin-top: 30px; overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 10px; overflow: hidden; font-size: 0.9em; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #334155; white-space: nowrap; }
        th { background: #0f172a; color: #10b981; }
        .img-preview { max-width: 50px; max-height: 50px; border-radius: 6px; border: 1px solid #10b981; }
        .section-title { color: #34d399; margin-bottom: 10px; text-align: center; font-size: 1.2em; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛒 تسجيل المشتريات</h1>
        <p style="margin:5px 0 0; color:#94a3b8; font-size:0.9em;">جميع البيانات والصور إلزامية</p>
    </div>

    <div class="form-container">
        <form id="purchaseForm" onsubmit="submitData(event)">
            <div class="grid">
                <div>
                    <label>القسم:</label>
                    <select id="category" required>
                        <option value="" disabled selected>اختر القسم...</option>
                        <option value="العاب">العاب</option>
                        <option value="اكل خدام">اكل خدام</option>
                        <option value="شنطه الانبا ابرام">شنطه الانبا ابرام</option>
                        <option value="ديكور">ديكور</option>
                        <option value="عمل فني">عمل فني</option>
                        <option value="عمل خدمي">عمل خدمي</option>
                    </select>
                </div>
                <div>
                    <label>اسم الخادم:</label>
                    <input type="text" id="servantName" placeholder="اسم الخادم..." required>
                </div>
                <div>
                    <label>رقم التواصل:</label>
                    <input type="tel" id="contactNumber" placeholder="رقم الموبايل..." required>
                </div>
                <div>
                    <label>المشتريات:</label>
                    <input type="text" id="item" placeholder="اسم المنتج..." required>
                </div>
                <div>
                    <label>الكميه:</label>
                    <input type="number" id="qty" min="0.1" step="0.1" placeholder="الكمية..." required>
                </div>
                <div>
                    <label>الوحده:</label>
                    <select id="unit" required>
                        <option value="" disabled selected>اختر الوحدة...</option>
                        <option value="قطعه">قطعه</option>
                        <option value="كيلو">كيلو</option>
                        <option value="لتر">لتر</option>
                    </select>
                </div>
                <div>
                    <label>تاريخ استلام المنتج:</label>
                    <input type="date" id="date" required>
                </div>
                <div>
                    <label>صوره المنتج:</label>
                    <input type="file" id="image" accept="image/*" required>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">حفظ البيانات</button>
        </form>
    </div>

    <h3 class="section-title" style="margin-top:30px;">📋 المشتريات التي قمت بإضافتها الآن</h3>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>القسم</th>
                    <th>الخادم</th>
                    <th>الرقم</th>
                    <th>المنتج</th>
                    <th>الكمية</th>
                    <th>الوحدة</th>
                    <th>التاريخ</th>
                    <th>الصورة</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="8">لم تقم بإضافة أي مشتريات حتى الآن.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyPq0BHN_rzdMfY9o1CC6GSv2-Ik38EDa2pQvqn3Jnmu3HE9PPxZY_N-uNvQ91A4lT7BQ/exec';
        let sessionData = []; 

        document.getElementById('date').valueAsDate = new Date();

        function renderSessionTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (sessionData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8">لم تقم بإضافة أي مشتريات حتى الآن.</td></tr>';
                return;
            }

            [...sessionData].reverse().forEach(row => {
                let imgHtml = (row.imageBase64) ? `<img src="data:${row.mimeType};base64,${row.imageBase64}" class="img-preview">` : 'بدون صورة';
                tbody.innerHTML += `
                    <tr>
                        <td><span style="background:#0f172a; padding:3px 6px; border-radius:4px; border:1px solid #10b981;">${row.category}</span></td>
                        <td style="color:#34d399; font-weight:bold;">${row.servantName}</td>
                        <td>${row.contactNumber}</td>
                        <td style="font-weight:bold;">${row.item}</td>
                        <td>${row.qty}</td>
                        <td>${row.unit}</td>
                        <td>${row.date}</td>
                        <td>${imgHtml}</td>
                    </tr>
                `;
            });
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function submitData(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "⏳ جاري الحفظ...";

            try {
                let file = document.getElementById('image').files[0];
                let payload = {
                    action: 'add',
                    category: document.getElementById('category').value,
                    servantName: document.getElementById('servantName').value,
                    contactNumber: document.getElementById('contactNumber').value,
                    item: document.getElementById('item').value,
                    qty: document.getElementById('qty').value,
                    unit: document.getElementById('unit').value,
                    date: document.getElementById('date').value,
                    imageBase64: await getBase64(file),
                    mimeType: file.type,
                    imageName: file.name
                };

                await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                sessionData.push(payload);
                renderSessionTable();
                alert("✅ تم تسجيل المشتريات بنجاح!");
                document.getElementById('purchaseForm').reset();
                document.getElementById('date').valueAsDate = new Date(); 
                
            } catch (error) {
                alert("⚠️ حدث خطأ أثناء الحفظ!");
            } finally {
                btn.disabled = false;
                btn.innerText = "حفظ البيانات";
            }
        }
    </script>
</body>
</html>
