<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تسجيل المشتريات - أسرة الأنبا ابرام</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Cairo',sans-serif;background:#0f172a;color:#f8fafc;padding:20px;max-width:900px;margin:auto;box-sizing:border-box}
.header{text-align:center;padding:35px 20px;background:linear-gradient(135deg,rgba(37,99,235,.1),rgba(16,185,129,.1));border-radius:20px;margin-bottom:30px;border:2px solid #1e40af;box-shadow:0 4px 20px rgba(37,99,235,.15)}
.logo-container{width:140px;height:140px;background:#fff;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(37,99,235,.5),0 0 10px rgba(16,185,129,.4);border:4px solid #3b82f6;overflow:hidden}
.logo-container img{width:90%;height:90%;object-fit:contain}
.header h1{margin:5px 0 0;font-size:2.2em;color:#3b82f6;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.header p{margin:8px 0 0;color:#94a3b8;font-size:1.1em;font-weight:600}
.form-container{background:#1e293b;padding:30px;border-radius:20px;border:1px solid #334155;box-shadow:0 10px 25px rgba(0,0,0,.4);width:100%;box-sizing:border-box}
.grid{display:flex;flex-direction:column;gap:20px;margin-bottom:20px;width:100%}
.grid>div{width:100%;box-sizing:border-box}
@media(min-width:768px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}}
label{font-weight:600;color:#38bdf8;margin-bottom:8px;display:block;font-size:1.05em}
select,input{width:100%;display:block;padding:14px 18px;border:2px solid #334155;border-radius:12px;background:#0f172a;color:#f8fafc;font-family:'Cairo',sans-serif;font-size:16px;box-sizing:border-box;-webkit-appearance:none;appearance:none;transition:all .3s}
select:focus,input:focus{border-color:#3b82f6;outline:none;box-shadow:0 0 12px rgba(59,130,246,.3)}
.hint{margin-top:8px;font-size:.95em;font-weight:600;min-height:1.2em}
.hint.ok{color:#10b981}.hint.warn{color:#f59e0b}.hint.info{color:#94a3b8}
.btn-submit{width:100%;padding:18px;background:linear-gradient(135deg,#2563eb,#10b981);color:#fff;font-size:20px;font-weight:700;border:none;border-radius:12px;cursor:pointer;transition:transform .2s,box-shadow .2s;margin-top:15px;display:block;box-sizing:border-box;box-shadow:0 4px 15px rgba(37,99,235,.3);font-family:'Cairo',sans-serif}
.btn-submit:active{transform:scale(.98)}.btn-submit:hover{box-shadow:0 6px 20px rgba(16,185,129,.4)}.btn-submit:disabled{opacity:.6;cursor:not-allowed}
.table-container{margin-top:35px;overflow-x:auto;width:100%;border-radius:15px;border:1px solid #334155}
table{width:100%;border-collapse:collapse;background:#1e293b;font-size:1em}
th,td{padding:15px;text-align:center;border-bottom:1px solid #334155;white-space:nowrap}
th{background:#0f172a;color:#38bdf8;font-weight:700;font-size:1.05em}
.img-preview{max-width:60px;max-height:60px;border-radius:6px;border:1px solid #3b82f6}
.section-title{color:#38bdf8;margin:40px 0 15px;text-align:center;font-size:1.5em;font-weight:700}
</style>
</head>
<body>
<div class="header">
  <div class="logo-container"><img src="logo.jpg" alt="شعار القافلة" onerror="this.style.display='none';"></div>
  <h1>🛒 تسجيل المشتريات</h1>
  <p>أسرة الأنبا ابرام - القافلة</p>
</div>

<div class="form-container">
<form id="purchaseForm" onsubmit="submitData(event)">
  <div class="grid">
    <div>
      <label>المشتريات (اسم المنتج):</label>
      <input type="text" id="item" list="itemList" placeholder="اكتب أو اختر المنتج من المخزن..." required oninput="onItemInput()" autocomplete="off">
      <datalist id="itemList"></datalist>
      <div class="hint info" id="stockHint">⏳ جاري تحميل أصناف المخزن...</div>
    </div>
    <div>
      <label>القسم:</label>
      <select id="category" required onchange="updateHint()">
        <option value="" disabled selected>اختر القسم...</option>
      </select>
    </div>
    <div>
      <label>الكميه:</label>
      <input type="number" id="qty" min="0.1" step="0.1" placeholder="الكمية..." required oninput="updateHint()">
    </div>
    <div>
      <label>الوحده:</label>
      <select id="unit" required>
        <option value="" disabled selected>اختر الوحدة...</option>
        <option value="قطعه">قطعه</option><option value="كيلو">كيلو</option><option value="لتر">لتر</option>
        <option value="كيس">كيس</option><option value="علبة">علبة</option><option value="لفة">لفة</option>
      </select>
    </div>
    <div><label>اسم الخادم:</label><input type="text" id="servantName" placeholder="اسم الخادم..." required></div>
    <div><label>رقم التواصل:</label><input type="tel" id="contactNumber" placeholder="رقم الموبايل..." required></div>
    <div><label>تاريخ طلب المنتج:</label><input type="date" id="date" required></div>
    <div><label>صورة المنتج:</label><input type="file" id="image" accept="image/*" required></div>
  </div>
  <button type="submit" class="btn-submit" id="submitBtn">حفظ البيانات</button>
</form>
</div>

<h3 class="section-title">📋 المشتريات التي قمت بإضافتها الآن</h3>
<div class="table-container"><table>
  <thead><tr><th>القسم</th><th>الخادم</th><th>الرقم</th><th>المنتج</th><th>الكمية</th><th>الوحدة</th><th>صُرف من المخزن</th><th>مطلوب شراؤه</th><th>التاريخ</th><th>الصورة</th></tr></thead>
  <tbody id="tableBody"><tr><td colspan="10">لم تقم بإضافة أي مشتريات حتى الآن.</td></tr></tbody>
</table></div>

<script>
const purchaseURL = 'https://script.google.com/macros/s/AKfycbyDo1kZM-rSbIaST73IdeDc3hnr-nza6i3yzoUEImPTUSU9DnIqYDyqyemlNztmb3gUCg/exec';
const inventoryURL = 'https://script.google.com/macros/s/AKfycbzMZ-4vIawAyFXmcBHsxUauSXIBLD7w27UoFUFuoR0U21nolJgbEAwLNWyAPwPcdAeG0w/exec';
const DEFAULT_CATS = ['العاب','اكل خدام','شنطه الانبا ابرام','ديكور','عمل فني','عمل خدمي'];
let inventory = [], sessionData = [];

const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = t => String(t || '').trim().toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه');
const errMsg = r => r && (r.error || (r.status === 'error' ? (r.message || 'خطأ في السيرفر') : ''));

// تاريخ اليوم كحد أدنى
const dateInput = document.getElementById('date');
const today = new Date();
const localDate = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().split('T')[0];
dateInput.value = localDate; dateInput.min = localDate;

function addOption(select, value) {
  if (value && ![...select.options].some(o => o.value === value)) {
    const o = document.createElement('option'); o.value = value; o.textContent = value; select.appendChild(o);
  }
}

async function loadInventory() {
  const catSel = document.getElementById('category');
  DEFAULT_CATS.forEach(c => addOption(catSel, c));
  try {
    const data = await (await fetch(inventoryURL)).json();
    inventory = Array.isArray(data) ? data.filter(i => i.sheet && i.item) : [];
    inventory.forEach(i => addOption(catSel, i.sheet));
    document.getElementById('itemList').innerHTML = inventory.map(i => `<option value="${esc(i.item)}">${esc(i.sheet)} - ${esc(i.unit)}</option>`).join('');
    document.getElementById('stockHint').textContent = inventory.length ? 'اختر منتجاً من المخزن ليظهر قسمه ووحدته تلقائياً، أو اكتب منتجاً جديداً.' : '';
  } catch (e) {
    document.getElementById('stockHint').textContent = '⚠️ تعذر تحميل المخزن، يمكنك إدخال البيانات يدوياً.';
  }
}

// الصنف المطابق للاسم (مع تفضيل القسم المختار)
function currentItem() {
  const name = norm(document.getElementById('item').value), cat = document.getElementById('category').value;
  const m = inventory.filter(i => norm(i.item) === name);
  return m.find(i => i.sheet === cat) || m[0] || null;
}

function onItemInput() {
  const it = currentItem();
  if (it) {
    document.getElementById('category').value = it.sheet;
    const u = document.getElementById('unit'); addOption(u, it.unit); u.value = it.unit;
  }
  updateHint();
}

function updateHint() {
  const hint = document.getElementById('stockHint'), it = currentItem();
  if (!document.getElementById('item').value.trim() || !inventory.length) return;
  if (!it) { hint.className = 'hint info'; hint.textContent = 'منتج غير موجود في المخزن — سيُسجَّل كطلب شراء كامل.'; return; }
  const avail = parseFloat(it.remaining) || 0, q = parseFloat(document.getElementById('qty').value) || 0;
  if (q > avail) {
    hint.className = 'hint warn';
    hint.textContent = `المتاح في المخزن: ${avail} ${it.unit} — سيُصرف المتاح ويُحوَّل الباقي (${+(q - avail).toFixed(2)}) لطلب شراء.`;
  } else {
    hint.className = 'hint ok';
    hint.textContent = `✅ متاح في المخزن: ${avail} ${it.unit}`;
  }
}

function renderSessionTable() {
  const tbody = document.getElementById('tableBody');
  if (!sessionData.length) { tbody.innerHTML = '<tr><td colspan="10">لم تقم بإضافة أي مشتريات حتى الآن.</td></tr>'; return; }
  tbody.innerHTML = [...sessionData].reverse().map(r => {
    const img = r.imageBase64 ? `<img src="data:${esc(r.mimeType)};base64,${r.imageBase64}" class="img-preview">` : 'بدون صورة';
    return `<tr>
      <td><span style="background:#0f172a;padding:4px 8px;border-radius:6px;border:1px solid #10b981;font-size:.9em">${esc(r.category)}</span></td>
      <td style="color:#38bdf8;font-weight:bold">${esc(r.requesterName)}</td><td>${esc(r.contactNumber)}</td>
      <td style="font-weight:bold">${esc(r.item)}</td><td>${esc(r.qty)}</td><td>${esc(r.unit)}</td>
      <td>${esc(r.fulfilled)}</td><td style="color:${r.needed > 0 ? '#f59e0b' : '#f8fafc'};font-weight:bold">${esc(r.needed)}</td>
      <td>${esc(r.date)}</td><td>${img}</td></tr>`;
  }).join('');
}

function getBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
  });
}

async function submitData(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.innerText = "⏳ جاري الحفظ والتأمين...";
  try {
    const file = document.getElementById('image').files[0];
    const payload = {
      action: 'add',
      category: document.getElementById('category').value,
      requesterName: document.getElementById('servantName').value,
      contactNumber: document.getElementById('contactNumber').value,
      item: document.getElementById('item').value.trim(),
      qty: document.getElementById('qty').value,
      unit: document.getElementById('unit').value,
      date: document.getElementById('date').value,
      imageBase64: await getBase64(file), mimeType: file.type, imageName: file.name
    };
    const result = await (await fetch(purchaseURL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })).json();
    if (errMsg(result)) { alert('⚠️ ' + errMsg(result)); return; }

    sessionData.push({ ...payload, fulfilled: result.fulfilled, needed: result.needed });
    renderSessionTable();
    alert(result.needed > 0
      ? `✅ تم صرف المتاح (${result.fulfilled}) من المخزن، وتحويل الباقي (${result.needed}) لطلب شراء.`
      : `✅ تم صرف كامل الكمية (${result.fulfilled}) من المخزن.`);
    document.getElementById('purchaseForm').reset();
    dateInput.value = localDate;
    document.getElementById('stockHint').className = 'hint info';
    document.getElementById('stockHint').textContent = 'اختر منتجاً من المخزن ليظهر قسمه ووحدته تلقائياً، أو اكتب منتجاً جديداً.';
    loadInventory();
  } catch (error) {
    alert("⚠️ حدث خطأ أثناء الحفظ!");
  } finally {
    btn.disabled = false; btn.innerText = "حفظ البيانات";
  }
}
loadInventory();
</script>
</body>
</html>
